name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-runtime.txt
      - name: Build one-file executable
        run: python -m PyInstaller --clean --noconfirm PhantomLimb.spec
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PhantomLimb-windows
          path: dist/PhantomLimb.exe
