{% extends "auth_layout.html" %}
{% block title %}New password | Neurosync AI{% endblock %}
{% block auth_title %}Choose a new password{% endblock %}
{% block auth_intro %}Use at least eight characters.{% endblock %}
{% block auth_form %}
<form method="post" class="auth-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
  <label class="form-group">New password<input class="form-input" type="password" name="password" autocomplete="new-password" minlength="8" required/></label>
  <label class="form-group">Confirm password<input class="form-input" type="password" name="confirm_password" autocomplete="new-password" minlength="8" required/></label>
  <button class="btn btn-primary" type="submit">Update password</button>
</form>
{% endblock %}
